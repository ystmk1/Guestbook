<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sympoiesis</title>
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />

  <!-- 폰트는 전부 자체 호스팅한다. 외부 CDN 요청이 없다. -->
  <link rel="preload" href="/fonts/sm3-latin.woff2" as="font"
        type="font/woff2" crossorigin />
</head>

<body>
  <!-- 맨 뒤에 깔리는 텍스처. 소리 없음, 끊김 없는 무한 루프.
       정방향+역방향으로 이어붙여 인코딩해서 이음매가 없다. -->
  <video class="bg" id="bg" src="/bg.mp4"
         autoplay muted loop playsinline preload="auto"
         disablepictureinpicture aria-hidden="true" tabindex="-1"></video>

  <header class="head">
    <h1>Sympoiesis</h1>
  </header>

  <!-- 모눈 · 숫자 · 채워진 칸이 모두 여기 그려진다 -->
  <canvas id="paper"></canvas>

  <!-- 칸을 누르면 뜨는 방명록 -->
  <div class="note" id="note" hidden>
    <p class="note-n" id="note-n"></p>
    <p class="note-t" id="note-t"></p>
    <p class="note-d"><span id="note-who"></span><span id="note-d"></span></p>
  </div>

  <form class="compose" id="compose" autocomplete="off">
    <input id="who" type="text" maxlength="12" spellcheck="false"
           placeholder="이름" aria-label="이름 (선택)" />
    <input id="entry" type="text" spellcheck="false"
           placeholder="한 줄 남기기" aria-label="한 줄 남기기" />
    <button type="submit" aria-label="남기기">
      <svg width="15" height="9" viewBox="0 0 15 9" aria-hidden="true">
        <path d="M0 4.5h13M9.5 1L13 4.5 9.5 8" fill="none"
              stroke="currentColor" stroke-width="1" />
      </svg>
    </button>
  </form>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
